<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>qpdf-run browser demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      main {
        width: min(720px, 100%);
        background: #ffffff;
        border: 1px solid #d9e1ee;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 18px 42px rgba(32, 47, 76, 0.12);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #526071;
        line-height: 1.45;
      }

      form {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 650;
      }

      input,
      select,
      button,
      a[download] {
        min-height: 42px;
        border-radius: 6px;
        font: inherit;
      }

      input,
      select {
        width: 100%;
        border: 1px solid #bdc8d8;
        background: #ffffff;
        padding: 8px 10px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      button,
      a[download] {
        border: 0;
        background: #155eef;
        color: #ffffff;
        padding: 10px 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      a[download][hidden] {
        display: none;
      }

      pre {
        margin: 20px 0 0;
        min-height: 92px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid #d9e1ee;
        border-radius: 6px;
        background: #f8fafc;
        padding: 12px;
        color: #253044;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>qpdf-run</h1>
      <p>Run qpdf in the browser and download the generated PDF.</p>

      <form id="form">
        <label>
          PDF file
          <input id="file" type="file" accept="application/pdf">
        </label>

        <label>
          Operation
          <select id="operation">
            <option value="qdf">Convert to QDF</option>
            <option value="linearize">Optimize for web</option>
          </select>
        </label>

        <div class="actions">
          <button id="run" type="submit">Run qpdf</button>
          <a id="download" download hidden>Download result</a>
        </div>
      </form>

      <pre id="status">Choose a PDF, then run qpdf.</pre>
    </main>

    <script type="module">
      import { createQpdfRunner } from '../../src/index.js';

      var form = document.getElementById('form');
      var fileInput = document.getElementById('file');
      var operationInput = document.getElementById('operation');
      var runButton = document.getElementById('run');
      var downloadLink = document.getElementById('download');
      var status = document.getElementById('status');
      var downloadUrl = '';

      form.addEventListener('submit', async function(event) {
        event.preventDefault();
        clearDownload();

        var file = fileInput.files && fileInput.files[0];
        if (!file) {
          status.textContent = 'Choose a PDF first.';
          return;
        }

        runButton.disabled = true;

        try {
          status.textContent = 'Loading qpdf...';
          var qpdf = await createQpdfRunner({
            assetBaseUrl: new URL('../../vendor/qpdf/', import.meta.url).href
          });

          try {
            var operation = getOperation(operationInput.value);
            status.textContent = 'Running ' + operation.label + '...';

            var output = await qpdf.runOne({
              input: await file.arrayBuffer(),
              inputName: 'input.pdf',
              outputName: operation.outputName,
              args: operation.args
            });

            showDownload(output, operation.outputName);
            status.textContent = [
              'Created ' + operation.outputName + ' (' + formatBytes(output.byteLength) + ').',
              'The result is ready to download.'
            ].join('\n');
          } finally {
            await qpdf.destroy();
          }
        } catch (error) {
          status.textContent = error && error.stack || String(error);
        } finally {
          runButton.disabled = false;
        }
      });

      window.addEventListener('pagehide', clearDownload);

      function getOperation(value) {
        if (value === 'linearize') {
          return {
            label: 'web optimization',
            outputName: 'linearized.pdf',
            args: ['--linearize', '--', 'input.pdf', 'linearized.pdf']
          };
        }

        return {
          label: 'QDF conversion',
          outputName: 'output.qdf.pdf',
          args: ['--qdf', '--object-streams=disable', '--decode-level=all', '--', 'input.pdf', 'output.qdf.pdf']
        };
      }

      function showDownload(bytes, fileName) {
        clearDownload();
        var blob = new Blob([bytes], { type: 'application/pdf' });
        downloadUrl = URL.createObjectURL(blob);
        downloadLink.href = downloadUrl;
        downloadLink.download = fileName;
        downloadLink.hidden = false;
        downloadLink.textContent = 'Download ' + fileName;
      }

      function clearDownload() {
        if (downloadUrl) URL.revokeObjectURL(downloadUrl);
        downloadUrl = '';
        downloadLink.removeAttribute('href');
        downloadLink.hidden = true;
        downloadLink.textContent = 'Download result';
      }

      function formatBytes(byteLength) {
        if (byteLength < 1024) return byteLength + ' bytes';
        if (byteLength < 1024 * 1024) return (byteLength / 1024).toFixed(1) + ' KB';
        return (byteLength / 1024 / 1024).toFixed(2) + ' MB';
      }
    </script>
  </body>
</html>
